name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]" -r requirements/serving-test.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Verify service test dependencies
        run: python -c "import fastapi, uvicorn, httpx2; from fastapi.testclient import TestClient"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest
