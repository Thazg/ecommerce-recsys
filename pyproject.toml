[build-system]
requires = [
    "setuptools>=75,<81",
]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-recsys"
version = "0.0.0"
description = "Production-oriented e-commerce recommendation system."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>8.4,<9",
    "ruff>0.16,<0.17",
    "pandas>=2.2,<3",
    "pyarrow>=15,<16",
    "wheel",
    "setuptools>=68",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
addopts = "-ra"